; Praat Pro Edition: Sound + TextGrid manual annotation shortcuts (UTF-8)
; Open Sound + TextGrid with View & Edit, then TextGrid > Keyboard shortcuts...
; Missing commands keep Praat defaults; None disables a menu shortcut.
; Assignments saved in the settings window appear below. Reload after editing.
; Examples (uncomment to enable):
[TextGridEditor.Shortcuts]
; Boundary/Add on selected tier=Ctrl+Enter
; Boundary/Remove=Ctrl+Shift+Backspace
; Formants/Get fourth formant=None
; Play/Play or stop=F4
; Play/Play window=Shift+F4
; TextGrid/Select next interval=Alt+Right
; TextGrid/Select previous interval=Alt+Left
