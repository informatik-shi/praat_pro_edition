name: Praat Pro macOS and Linux packages

on:
  push:
    branches: ["build/macos-linux"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Install desktop and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libasound2-dev libpulse-dev libjack-jackd2-dev xvfb xauth
      - name: Build and verify Linux x86-64
        run: bash scripts/build-linux.sh
      - uses: actions/upload-artifact@v6
        with:
          name: praat-pro-linux-x86_64
          path: dist/praat-pro-linux-x86_64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: linux-build-logs
          path: .local-build/*.log
          include-hidden-files: true
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Build and verify macOS universal application
        run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v6
        with:
          name: praat-pro-macos-universal
          path: |
            dist/praat-pro-macos-universal.zip
            dist/praat-pro-macos-universal.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: macos-build-logs
          path: .local-build/*.log
          include-hidden-files: true
