name: Praat Pro for Termux tablets
on:
  push:
    branches: ["build/termux-tablet"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.local-build/ccache
      CCACHE_MAXSIZE: 750M
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache/restore@v6
        with:
          path: .local-build/ccache
          key: termux-arm64-ubuntu24-ccache-${{ github.sha }}
          restore-keys: termux-arm64-ubuntu24-ccache-
      - name: Install ARM64 build and window-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache pkg-config libgtk-3-dev libasound2-dev libpulse-dev libjack-jackd2-dev xvfb xauth x11-apps x11-utils xdotool openbox wmctrl dbus-x11 librsvg2-common shared-mime-info fonts-dejavu-core python3-pil
      - name: Build ARM64, test analyses and tablet windows
        run: bash scripts/build-termux.sh
      - uses: actions/upload-artifact@v6
        with:
          name: praat-pro-termux-aarch64
          path: |
            dist/praat-pro-termux-aarch64.tar.gz
            dist/praat-pro-termux-aarch64.sha256
            dist/install-praat-pro-termux.sh
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: termux-window-checks
          path: |
            .local-build/tablet-gui-*/
            .local-build/*tests.log
            .local-build/build-termux.log
          include-hidden-files: true
          if-no-files-found: warn
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: .local-build/ccache
          key: termux-arm64-ubuntu24-ccache-${{ github.sha }}
